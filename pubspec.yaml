name: sy_projects
description: "SY Projects - Multi-platform Flutter app for portfolio and project management"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.0
  
  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Navigation & Routing
  go_router: ^11.0.0
  
  # Storage & Preferences
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # UI & Design
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  
  # Form Validation
  formz: ^0.6.0
  
  # Date/Time
  intl: ^0.19.0
  
  # JSON Serialization
  json_annotation: ^4.9.0
  json_serializable: ^6.7.0
  
  # Logging
  logger: ^2.1.0
  
  # URL Launcher
  url_launcher: ^6.2.0
  
  # Animation & Effects
  flutter_animate: ^4.2.0
  
  # Image Picker (for forms)
  image_picker: ^1.0.0
  
  # Platform detection
  universal_platform: ^1.1.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  firebase_analytics: ^12.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
